appId: dev.sshexplorer.desktop
productName: WooSSH
copyright: WooSSH

directories:
  output: ../release
  buildResources: resources

# Only the bundled shell and its assets ship; the API server is compiled into
# build/main.cjs and the built web app arrives via extraResources.
files:
  - build/**
  - package.json
  - '!**/*.map'

extraResources:
  - from: ../web/dist
    to: web

asar: true
compression: normal

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WooSSH
  uninstallDisplayName: WooSSH
  artifactName: ${productName}-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-Portable-${version}.${ext}
  requestExecutionLevel: user

# Where releases live. electron-updater reads the latest.yml this produces, so a
# published release is what makes an installed build able to update itself.
publish:
  provider: github
  owner: thewoolfi
  repo: WooSSH-Explorer
  releaseType: release

# `updaterCacheDirName` is not an electron-builder option in 26.x — neither at the root nor
# under `win`; both are rejected by the schema. The updater therefore names its cache folder
# after the package, `@ssh-explorerdesktop-updater`, which is what it will keep until the
# desktop workspace package is renamed to something plain.

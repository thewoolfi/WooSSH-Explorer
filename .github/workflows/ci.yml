name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    name: Typecheck, unit tests, e2e and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run typecheck` also covers the desktop workspace: that is type-only,
      # so no Electron packaging happens on Linux.
      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Server unit tests
        run: npm test

      - name: Web unit tests (vitest)
        run: npm run test:web

      - name: Server end-to-end tests
        run: npm run test:e2e

      # Root build = server + web only; the desktop bundle is out of scope here.
      - name: Build server and web
        run: npm run build
